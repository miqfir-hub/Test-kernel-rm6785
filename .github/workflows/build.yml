name: Build Kernel RM6785 (RUI2)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch'
        required: true
        default: 'backup-miku'
        type: string
      ksu_variant:
        description: 'Root: BakaSU (with SUSFS) or Stock (no root)'
        required: true
        default: 'BakaSU'
        type: choice
        options:
          - 'BakaSU'
          - 'Stock'
      ksu_ref:
        description: 'BakaSU commit/tag/branch (pinned = reproducible)'
        required: true
        default: '7b65bde0710b5e7c6f755545cb15a4abd417f3a8'
        type: string
      stable_mode:
        description: 'Stable mode (no panic on oops, SUSFS risky options off)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      KERNEL_REPO: https://github.com/elohim-etz/android_kernel_realme_mt6785.git
      CLANG_REPO: https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git
      ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
      DEFCONFIG: RM6785_defconfig
      ARCH: arm64
      SUBARCH: arm64
      LC_ALL: C
      CCACHE_DIR: /home/runner/.ccache
      IN_BRANCH: ${{ github.event.inputs.kernel_branch }}
      IN_VARIANT: ${{ github.event.inputs.ksu_variant }}
      IN_KSU_REF: ${{ github.event.inputs.ksu_ref }}
      IN_STABLE: ${{ github.event.inputs.stable_mode }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev git zip unzip curl wget ccache cpio lz4 \
            python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-rm6785-${{ github.run_id }}
          restore-keys: |
            ccache-rm6785-

      - name: Restore clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-r547379

      - name: Download clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: git clone --depth=1 "$CLANG_REPO" clang

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "$IN_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          echo "KERNEL_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Add BakaSU (KernelSU + SUSFS)
        if: github.event.inputs.ksu_variant == 'BakaSU'
        working-directory: kernel
        run: |
          # The hooks already in this kernel source are BakaSU-style (SUSFS inline hook),
          # so BakaSU is the driver that matches it. KernelSU-Next does not link.
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/${IN_KSU_REF}/kernel/setup.sh" | bash -s "${IN_KSU_REF}"
          ls -d KernelSU drivers/kernelsu
          echo "KSU_COMMIT=$(git -C KernelSU rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build kernel
        working-directory: kernel
        run: |
          set -eo pipefail
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="github-actions"
          ccache --max-size=5G

          mkdir -p out
          make O=out ARCH=arm64 "$DEFCONFIG"

          if [ "$IN_STABLE" = "true" ]; then
            echo "Applying stable mode"
            ./scripts/config --file out/.config \
              -d PANIC_ON_OOPS \
              -d KSU_SUSFS_SUS_MAP \
              -d KSU_SUSFS_SUS_MEMFD \
              -d KSU_SUSFS_ENABLE_LOG
            make O=out ARCH=arm64 olddefconfig
          fi

          grep -E "^(# )?CONFIG_(KSU|PANIC_ON_OOPS)[A-Z_]*[= ]" out/.config || true

          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_NO_ERROR_ON_MISMATCH=y 2>&1 | tee build.log

          ccache --show-stats || true

      - name: Check build output
        working-directory: kernel
        run: |
          ls -la out/arch/arm64/boot/ || true
          test -f out/arch/arm64/boot/Image.gz || { echo "Image.gz not found"; exit 1; }
          grep -m1 "UTS_VERSION\|UTS_RELEASE" out/include/generated/compile.h out/include/generated/utsrelease.h || true

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 "$ANYKERNEL_REPO" AnyKernel
          rm -rf AnyKernel/.git AnyKernel/.github
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel/Image.gz

          cat > AnyKernel/anykernel.sh <<'EOF'
          ### AnyKernel3 script for Realme RM6785 (RUI2)
          properties() { '
          kernel.string=RM6785 RUI2 kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=RM6785
          device.name2=RMX2001
          device.name3=RMX2001L1
          device.name4=RMX2002
          device.name5=RMX2002L1
          device.name6=RMX2003
          device.name7=RMX2003L1
          device.name8=RMX2005L1
          device.name9=RMX2151
          device.name10=RMX2151L1
          device.name11=RMX2153
          device.name12=RMX2153L1
          device.name13=RMX2155
          device.name14=RMX2155L1
          device.name15=RMX2156
          device.name16=RMX2156L1
          device.name17=RMX2161
          device.name18=RMX2161L1
          device.name19=RMX2163
          device.name20=RMX2163L1
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
            set_perm_recursive 0 0 755 644 $RAMDISK/*
            set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin
          }

          BLOCK=/dev/block/by-name/boot
          IS_SLOT_DEVICE=0
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto

          . tools/ak3-core.sh

          dump_boot
          write_boot
          EOF

          TS=$(TZ=Asia/Jakarta date +"%Y%m%d-%H%M")
          NAME="Miku-RM6785-${IN_VARIANT}"
          if [ "$IN_VARIANT" = "BakaSU" ]; then
            NAME="${NAME}-SUSFS"
          fi
          if [ "$IN_STABLE" = "true" ]; then
            NAME="${NAME}-Stable"
          fi
          NAME="${NAME}-${TS}"
          echo "ZIP_NAME=${NAME}" >> "$GITHUB_ENV"

          cd AnyKernel
          zip -r9 "../${NAME}.zip" . > /dev/null
          cd ..
          ls -la "${NAME}.zip"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## Build selesai"
            echo "- Zip: \`${ZIP_NAME}.zip\`"
            echo "- Branch: \`${IN_BRANCH}\` (commit \`${KERNEL_COMMIT}\`)"
            echo "- Root: ${IN_VARIANT} (${KSU_COMMIT:-none}), Stable mode: ${IN_STABLE}"
            echo "- Unduh di bagian **Artifacts** paling bawah halaman ini."
          } >> "$GITHUB_STEP_SUMMARY"
